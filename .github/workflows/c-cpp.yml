name: C/C++ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64


      # 生成 MinGW Vulkan 库
      - name: Generate Vulkan MinGW Library
        shell: cmd
        run: |
          cd libraries\vulkan\Lib

          copy %WINDIR%\System32\vulkan-1.dll .

          gendef vulkan-1.dll

          dlltool ^
          -d vulkan-1.def ^
          -D vulkan-1.dll ^
          -l libvulkan-1.a


      - name: Build
        shell: cmd
        run: |
          mingw32-make all


      - name: Check output
        shell: cmd
        run:
          dir dist


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winhttp-build
          path: dist/
