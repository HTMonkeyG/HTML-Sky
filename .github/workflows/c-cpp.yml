name: C/C++ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Install MinGW
        run: |
          choco install mingw -y
          refreshenv


      - name: Verify
        run: |
          gcc --version
          g++ --version
          mingw32-make --version


      - name: Build
        run: mingw32-make all


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: winhttp-build
          path: dist/
